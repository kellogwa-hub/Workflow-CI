name: CI Workflow MLflow

# Workflow akan berjalan otomatis setiap ada 'push' ke branch main/master
on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Mengambil kode dari repositori GitHub Anda
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Menyiapkan Python (Sesuai rekomendasi Dicoding)
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.7'

      # 3. Menginstal library dasar sesuai modelling.py
      - name: Install Dependencies
        run: |
          pip install mlflow==2.19.0
          pip install scikit-learn pandas

      # 4. Menjalankan training model lewat MLProject
      - name: Run MLflow Project
        run: |
          cd MLProject
          mlflow run . --env-manager local

      # 5. Menyimpan Artefak MLruns ke GitHub (Sesuai syarat kriteria Advance)
      - name: Upload MLruns Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mlruns-artifact
          path: MLProject/mlruns/

      # 6. Login ke Docker Hub menggunakan Secrets yang sudah Anda buat
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 7. Membangun Docker Image dan Push ke Docker Hub (Dengan Patching Python 3.9)
      - name: Build and Push Docker Image
        run: |
          # Mencari lokasi folder model
          MODEL_PATH=$(find MLProject/mlruns -type d -name "model" | head -n 1)
          echo "Lokasi model ditemukan di: $MODEL_PATH"
          
          # A. Generate Dockerfile (Sebagai ganti langsung build-docker karena bug MLflow 2.19.0)
          mlflow models generate-dockerfile -m $MODEL_PATH -d docker_build_dir
          
          # B. Patching URL get-pip.py yang usang agar menggunakan versi spesifik Python 3.9
          sed -i 's|https://bootstrap.pypa.io/get-pip.py|https://bootstrap.pypa.io/pip/3.9/get-pip.py|g' docker_build_dir/Dockerfile
          
          # C. Build Docker image dari Dockerfile yang sudah diperbaiki
          cd docker_build_dir
          docker build -t ${{ secrets.DOCKER_USERNAME }}/eksperimen-model:latest .
          
          # D. Mendorong image ke Docker Hub
          docker push ${{ secrets.DOCKER_USERNAME }}/eksperimen-model:latest